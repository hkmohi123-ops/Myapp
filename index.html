<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ AURA - Your Intelligent Voice Assistant ✨</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at 20% 20%, #2a2a2a, #000000);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated background particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: rgba(255, 105, 180, 0.5);
            border-radius: 50%;
            animation: float 8s infinite;
            box-shadow: 0 0 15px #ff69b4;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) scale(1);
                opacity: 0;
            }
            50% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) scale(0.5);
                opacity: 0;
            }
        }

        /* Main container */
        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 900px;
            background: rgba(20, 20, 30, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 50px;
            padding: 40px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8),
                        0 0 0 2px rgba(255, 105, 180, 0.3) inset,
                        0 0 30px rgba(255, 105, 180, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            animation: containerGlow 4s infinite;
        }

        @keyframes containerGlow {
            0%, 100% { box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), 0 0 0 2px rgba(255, 105, 180, 0.3) inset, 0 0 30px rgba(255, 105, 180, 0.3); }
            50% { box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), 0 0 0 3px rgba(255, 105, 180, 0.6) inset, 0 0 50px rgba(255, 105, 180, 0.6); }
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
        }

        .title {
            font-size: 3.5em;
            font-weight: bold;
            background: linear-gradient(135deg, #ff69b4, #9b59b6, #3498db);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(255, 105, 180, 0.5);
            animation: titlePulse 3s infinite;
            letter-spacing: 2px;
        }

        @keyframes titlePulse {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.3); }
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.7);
            font-size: 1.2em;
            margin-top: 10px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        /* Voice Assistant Avatar */
        .avatar-container {
            display: flex;
            justify-content: center;
            margin: 30px 0;
        }

        .avatar {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff69b4, #9b59b6, #3498db);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            animation: avatarFloat 6s infinite, avatarGlow 3s infinite;
            box-shadow: 0 0 50px rgba(255, 105, 180, 0.6);
            cursor: pointer;
            transition: all 0.3s;
        }

        .avatar:hover {
            transform: scale(1.05);
            box-shadow: 0 0 80px rgba(255, 105, 180, 0.9);
        }

        @keyframes avatarFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        @keyframes avatarGlow {
            0%, 100% { filter: hue-rotate(0deg); }
            50% { filter: hue-rotate(30deg); }
        }

        .avatar-inner {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            border: 3px solid rgba(255, 255, 255, 0.3);
        }

        .avatar-icon {
            font-size: 60px;
            margin-bottom: 10px;
            animation: iconPulse 2s infinite;
        }

        @keyframes iconPulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.8; }
        }

        .avatar-name {
            font-size: 20px;
            font-weight: bold;
            background: linear-gradient(135deg, #ff69b4, #9b59b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Speaking animation rings */
        .speaking-ring {
            position: absolute;
            width: 250px;
            height: 250px;
            border-radius: 50%;
            border: 3px solid rgba(255, 105, 180, 0.5);
            animation: ringPulse 2s infinite;
            opacity: 0;
        }

        .avatar.speaking .speaking-ring {
            opacity: 1;
        }

        .speaking-ring:nth-child(2) { animation-delay: 0.5s; }
        .speaking-ring:nth-child(3) { animation-delay: 1s; }

        @keyframes ringPulse {
            0% {
                transform: scale(1);
                opacity: 0.5;
            }
            100% {
                transform: scale(1.5);
                opacity: 0;
            }
        }

        /* Voice wave animation */
        .voice-wave {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 5px;
            height: 40px;
            margin: 20px 0;
        }

        .wave-bar {
            width: 8px;
            height: 20px;
            background: linear-gradient(135deg, #ff69b4, #9b59b6);
            border-radius: 10px;
            animation: wave 1s infinite;
        }

        .wave-bar:nth-child(2) { animation-delay: 0.1s; }
        .wave-bar:nth-child(3) { animation-delay: 0.2s; }
        .wave-bar:nth-child(4) { animation-delay: 0.3s; }
        .wave-bar:nth-child(5) { animation-delay: 0.4s; }
        .wave-bar:nth-child(6) { animation-delay: 0.5s; }
        .wave-bar:nth-child(7) { animation-delay: 0.6s; }
        .wave-bar:nth-child(8) { animation-delay: 0.7s; }

        @keyframes wave {
            0%, 100% { height: 20px; }
            50% { height: 40px; }
        }

        /* Language selector */
        .language-selector {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .lang-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 105, 180, 0.5);
            color: white;
            padding: 12px 25px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1.1em;
            font-weight: bold;
            transition: all 0.3s;
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .lang-btn:hover {
            background: rgba(255, 105, 180, 0.3);
            transform: translateY(-3px);
            box-shadow: 0 5px 20px rgba(255, 105, 180, 0.4);
            border-color: #ff69b4;
        }

        .lang-btn.active {
            background: linear-gradient(135deg, #ff69b4, #9b59b6);
            border-color: white;
            box-shadow: 0 0 20px rgba(255, 105, 180, 0.6);
        }

        /* Input area */
        .input-container {
            margin: 30px 0;
        }

        .text-input {
            width: 100%;
            min-height: 120px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.5);
            border: 3px solid rgba(255, 105, 180, 0.5);
            border-radius: 30px;
            color: white;
            font-size: 1.2em;
            font-family: inherit;
            resize: vertical;
            transition: all 0.3s;
            backdrop-filter: blur(5px);
        }

        .text-input:focus {
            outline: none;
            border-color: #ff69b4;
            box-shadow: 0 0 30px rgba(255, 105, 180, 0.4);
        }

        .text-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        /* Control buttons */
        .control-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin: 30px 0;
            flex-wrap: wrap;
        }

        .speak-btn {
            background: linear-gradient(135deg, #ff69b4, #9b59b6);
            color: white;
            border: none;
            padding: 18px 40px;
            border-radius: 60px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 0 30px rgba(255, 105, 180, 0.4);
            display: flex;
            align-items: center;
            gap: 12px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            min-width: 200px;
            justify-content: center;
        }

        .speak-btn:hover:not(:disabled) {
            transform: translateY(-5px);
            box-shadow: 0 0 50px rgba(255, 105, 180, 0.7);
            border-color: white;
        }

        .speak-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .speak-btn.stop {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            box-shadow: 0 0 30px rgba(231, 76, 60, 0.4);
        }

        /* Quote buttons */
        .quote-section {
            margin: 30px 0;
        }

        .quote-title {
            color: white;
            font-size: 1.5em;
            margin-bottom: 20px;
            text-align: center;
            text-shadow: 0 0 10px #ff69b4;
        }

        .quote-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
        }

        .quote-btn {
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(255, 105, 180, 0.5);
            color: white;
            padding: 20px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: left;
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .quote-btn:hover {
            transform: translateY(-5px) scale(1.02);
            border-color: #ff69b4;
            box-shadow: 0 10px 30px rgba(255, 105, 180, 0.4);
            background: rgba(255, 105, 180, 0.1);
        }

        .quote-btn i {
            font-size: 30px;
            color: #ff69b4;
        }

        .quote-btn .quote-text {
            font-size: 1em;
            line-height: 1.5;
        }

        .quote-btn .quote-author {
            font-size: 0.9em;
            color: #ff69b4;
            margin-top: 5px;
        }

        /* Status indicator */
        .status {
            text-align: center;
            color: rgba(255, 255, 255, 0.8);
            margin: 20px 0;
            font-size: 1.1em;
            padding: 10px;
            border-radius: 50px;
            background: rgba(0, 0, 0, 0.3);
        }

        .status.speaking {
            color: #ff69b4;
            animation: statusPulse 1.5s infinite;
        }

        @keyframes statusPulse {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 1; text-shadow: 0 0 10px #ff69b4; }
        }

        /* Footer */
        .footer {
            text-align: center;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 30px;
            font-size: 0.9em;
        }

        .footer i {
            color: #ff69b4;
        }
    </style>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Animated particles -->
    <div class="particles" id="particles"></div>

    <div class="container">
        <div class="header">
            <h1 class="title">✨ AURA ✨</h1>
            <div class="subtitle">Your Intelligent Voice Assistant</div>
        </div>

        <!-- Avatar Section -->
        <div class="avatar-container">
            <div class="avatar" id="avatar">
                <div class="speaking-ring"></div>

                <div class="avatar-inner">

                    <span class="avatar-name">AURA</span>
                </div>
            </div>
        </div>

        <!-- Voice Wave Animation -->
        <div class="voice-wave" id="voiceWave">
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
        </div>

        <!-- Status -->
        <div class="status" id="status">
            <i class="fas fa-circle"></i> Ready to speak
        </div>

        <!-- Language Selector -->
        <div class="language-selector">
            <button class="lang-btn active" onclick="setLanguage('en', this)" data-lang="en">
                <i class="fas fa-language"></i> English
            </button>
            <button class="lang-btn" onclick="setLanguage('hi', this)" data-lang="hi">
                <i class="fas fa-language"></i> हिन्दी
            </button>
            <button class="lang-btn" onclick="setLanguage('bn', this)" data-lang="bn">
                <i class="fas fa-language"></i> বাংলা
            </button>
        </div>

        <!-- Text Input -->
        <div class="input-container">
            <textarea 
                class="text-input" 
                id="textInput" 
                placeholder="Type anything here... यहाँ कुछ भी लिखें... এখানে কিছু লিখুন..."

        <!-- Control Buttons -->
        <div class="control-buttons">
            <button class="speak-btn" id="speakBtn" onclick="speakText()">
                <i class="fas fa-play"></i> Speak It! 🎤
            </button>

                <i class="fas fa-stop"></i> Stop ⏹️
            </button>
            <button class="speak-btn" onclick="clearText()">

        </div>

        <!-- Quote Buttons Section -->
        <div class="quote-section">
            <h3 class="quote-title">📜 Inspiring Quotes 📜</h3>
            <div class="quote-buttons">
                <button class="quote-btn" onclick="speakQuote('en', 0)">
                    <i class="fas fa-quote-right"></i>
                    <div class="quote-text">
                        "The only way to do great work is to love what you do."
                        <div class="quote-author">- Steve Jobs</div>
                    </div>
                </button>
                
                <button class="quote-btn" onclick="speakQuote('hi', 1)">
                    <i class="fas fa-quote-right"></i>
                    <div class="quote-text">
                        "कर्मण्येवाधिकारस्ते मा फलेषु कदाचन।"
                        <div class="quote-author">- भगवद गीता</div>
                    </div>
                </button>
                
                <button class="quote-btn" onclick="speakQuote('bn', 2)">
                    <i class="fas fa-quote-right"></i>
                    <div class="quote-text">
                        "জীবন যেমন, তেমনি করে চলা উচিত।"
                        <div class="quote-author">- রবীন্দ্রনাথ ঠাকুর</div>
                    </div>
                </button>
                
                <button class="quote-btn" onclick="speakQuote('en', 3)">
                    <i class="fas fa-quote-right"></i>
                    <div class="quote-text">
                        "Be the change you wish to see in the world."
                        <div class="quote-author">- Mahatma Gandhi</div>
                    </div>
                </button>
                
                <button class="quote-btn" onclick="speakQuote('hi', 4)">
                    <i class="fas fa-quote-right"></i>
                    <div class="quote-text">
                        "हिम्मत न हारो, यह जीवन है।"
                        <div class="quote-author">- प्रेरक विचार</div>
                    </div>
                </button>
                
                <button class="quote-btn" onclick="speakQuote('bn', 5)">
                    <i class="fas fa-quote-right"></i>
                    <div class="quote-text">
                        "সাফল্য চিরস্থায়ী নয়, ব্যর্থতা প্রাণঘাতী নয়।"
                        <div class="quote-author">- অনুপ্রেরণা</div>
                    </div>
                </button>
            </div>
        </div>

        <div class="footer">
            <p>Made with <i class="fas fa-heart"></i> by AURA | Multi-lingual Voice Assistant</p>
        </div>
    </div>

    <script>
        // Create animated particles
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            for (let i = 0; i < 50; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDuration = (Math.random() * 10 + 5) + 's';
                particle.style.animationDelay = Math.random() * 5 + 's';
                particle.style.background = `rgba(${255 - Math.random() * 100}, ${105 + Math.random() * 100}, ${180 + Math.random() * 75}, ${0.3 + Math.random() * 0.5})`;
                particle.style.boxShadow = `0 0 ${15 + Math.random() * 20}px ${particle.style.background}`;
                particlesContainer.appendChild(particle);
            }
        }

        // Voice Assistant Configuration
        let currentLanguage = 'en';
        let currentUtterance = null;
        let isSpeaking = false;
        let availableVoices = [];
        let femaleVoice = null;

        // Initialize voices

            availableVoices = window.speechSynthesis.getVoices();

                // Try to find by name
                for (let voice of availableVoices) {
                    if (voice.lang.startsWith(lang)) {
                        const voiceName = voice.name.toLowerCase();
                        i
